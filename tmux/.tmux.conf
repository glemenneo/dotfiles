# ── General ──
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g focus-events on
# Image previews (yazi) inside tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g escape-time 0
set -g history-limit 50000

# ── Key bindings ──
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Vi mode in copy/paste
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Scroll with PgUp/PgDn
# Fullscreen apps (Claude Code, less, vim) get PgUp themselves; shells get tmux scrollback
bind -n PageUp if -F '#{alternate_on}' 'send-keys PageUp' 'copy-mode -eu'
bind -T copy-mode-vi PageUp send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down

# ── Navigation ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Status bar ──
# Colour names only, so the bar follows the terminal theme (kitty, Termius)
set -g status-position top
set -g status-style bg=default,fg=white
# Session pill: blue, yellow while the prefix is held, purple in copy mode
set -g status-left-length 40
set -g status-left "#[fg=#{?client_prefix,yellow,#{?pane_in_mode,magenta,blue}}]#[reverse,bold] #S #[noreverse,nobold] "
# Current window as a pill, others dimmed; same width so the bar does not shift
set -g window-status-separator ""
set -g window-status-current-style default  # tmux 3.8 underlines it by default
set -g window-status-format "#[fg=brightblack]  #I #W#{?window_zoomed_flag, 󰊓,}  "
set -g window-status-current-format "#[fg=magenta]#[reverse,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[noreverse,nobold]"
# Date dimmed, clock in a pill
set -g status-right "#[fg=brightblack]%a %d %b #[fg=cyan]#[reverse] %H:%M #[noreverse]"

# ── Sane defaults ──
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on