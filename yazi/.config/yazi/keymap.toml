# smart-enter.yazi: l enters folders and opens files
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# Enter does the same (yazi's default Enter opens folders in the editor instead of going in)
[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# restore.yazi: u brings back the last trashed files, U lets you pick which
[[mgr.prepend_keymap]]
on   = "u"
run  = "plugin restore"
desc = "Restore last deleted files/folders"

[[mgr.prepend_keymap]]
on   = "U"
run  = "plugin restore -- --interactive"
desc = "Restore deleted files/folders (pick)"

# mount.yazi: mount, unmount and eject drives
[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Mount manager"

# jump-to-char.yazi on F, so f stays filter
[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin jump-to-char"
desc = "Jump to the next file starting with a char"
