# git.yazi fetchers (plugins themselves: `ya pkg install` from package.toml)
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# PDFs open in tdf inside the terminal; O (open with) still offers the desktop viewer
[opener]
read = [
    { run = "tdf %s1", block = true, desc = "tdf (terminal)", for = "unix" },
]

[open]
prepend_rules = [
    { mime = "application/pdf", use = [ "read", "open" ] },
]

# Previews (first match wins): glow-rendered Markdown,
# mediainfo for audio/video/images/subtitles (codec, length, tracks; still shows the picture)
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

[[plugin.prepend_previewers]]
mime = "{audio,video,image}/*"
run  = "mediainfo"

[[plugin.prepend_previewers]]
mime = "application/subrip"
run  = "mediainfo"

[[plugin.prepend_preloaders]]
mime = "{audio,video,image}/*"
run  = "mediainfo"

[[plugin.prepend_preloaders]]
mime = "application/subrip"
run  = "mediainfo"
